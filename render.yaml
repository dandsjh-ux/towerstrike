# Render Blueprint: https://render.com/docs/blueprint-spec
# Rooms live in server memory, so run a single instance (do not scale horizontally).
services:
  - type: web
    name: towerstrike
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
